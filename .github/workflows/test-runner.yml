name: Deploy Tax Frontend

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build-and-deploy:

    runs-on: [self-hosted, Windows, X64, taxfrontend]

    steps:

      # --------------------------------
      # 1. Checkout source code
      # --------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------
      # 2. Check Node
      # --------------------------------
      - name: Check Node and NPM
        shell: powershell
        run: |
          Write-Host "Node version:"
          node -v

          Write-Host "NPM version:"
          npm -v


      # --------------------------------
      # 3. Install dependencies
      # --------------------------------
      - name: Install Dependencies
        shell: powershell
        run: |
          npm ci


      # --------------------------------
      # 4. Build React/Vite
      # --------------------------------
      - name: Build Frontend
        shell: powershell
        run: |
          npm run build


      # --------------------------------
      # 5. Verify build
      # --------------------------------
      - name: Verify Build
        shell: powershell
        run: |

          $buildPath = "$env:GITHUB_WORKSPACE\dist"

          if (!(Test-Path $buildPath)) {
              Write-Error "dist folder was not created."
              exit 1
          }

          Write-Host "Build successful."
          Write-Host "Build location:"
          Write-Host $buildPath

          Get-ChildItem $buildPath
      # --------------------------------
      # 6. Deploy to IIS with Backup
      # --------------------------------
      - name: Deploy to IIS
        shell: powershell
        run: |

          $source = "$env:GITHUB_WORKSPACE\dist"
          $destination = "C:\test\tax-frontend"

          # Backup directory
          $backupRoot = "C:\test\tax-frontend-backups"
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $backup = "$backupRoot\$timestamp"


          Write-Host "===================================="
          Write-Host "Starting Deployment"
          Write-Host "===================================="

          Write-Host "Source:"
          Write-Host $source

          Write-Host "Destination:"
          Write-Host $destination

          Write-Host "Backup:"
          Write-Host $backup


          # --------------------------------
          # Create destination if needed
          # --------------------------------

          if (!(Test-Path $destination)) {

              New-Item `
                -ItemType Directory `
                -Path $destination `
                -Force

          }


          # --------------------------------
          # Create backup directory
          # --------------------------------

          if (!(Test-Path $backupRoot)) {

              New-Item `
                -ItemType Directory `
                -Path $backupRoot `
                -Force

          }


          # --------------------------------
          # Backup current deployment
          # --------------------------------

          if ((Get-ChildItem $destination -Force | Measure-Object).Count -gt 0) {

              Write-Host "Creating deployment backup..."

              New-Item `
                -ItemType Directory `
                -Path $backup `
                -Force

              Copy-Item `
                -Path "$destination\*" `
                -Destination $backup `
                -Recurse `
                -Force

              Write-Host "Backup created successfully."

          }
          else {

              Write-Host "No existing deployment found. Skipping backup."

          }


          # --------------------------------
          # Remove old frontend files
          # Keep web.config
          # --------------------------------

          Write-Host "Removing old frontend files..."

          Get-ChildItem `
            -Path $destination `
            -Force |
          Where-Object {
              $_.Name -ne "web.config"
          } |
          Remove-Item `
            -Recurse `
            -Force


          # --------------------------------
          # Copy new frontend
          # --------------------------------

          Write-Host "Copying new frontend..."

          Copy-Item `
            -Path "$source\*" `
            -Destination $destination `
            -Recurse `
            -Force


          Write-Host "New frontend copied successfully."


          # --------------------------------
          # Verify deployment files
          # --------------------------------

          if (!(Test-Path "$destination\index.html")) {

              Write-Error "Deployment failed: index.html not found."

              throw "Deployment verification failed."

          }


          Write-Host "Deployment files verified."


          # --------------------------------
          # Health Check
          # --------------------------------

          $healthUrl = "http://localhost:8085/"

          Write-Host "Running health check..."
          Write-Host "Checking: $healthUrl"


          try {

              $response = Invoke-WebRequest `
                -Uri $healthUrl `
                -UseBasicParsing `
                -TimeoutSec 30

              Write-Host "HTTP Status Code: $($response.StatusCode)"

              if ($response.StatusCode -ne 200) {

                  throw "Website returned HTTP status $($response.StatusCode)"

              }

              Write-Host "Health check successful."

          }
          catch {

              Write-Error "Health check failed."

              Write-Error $_

              # --------------------------------
              # Rollback
              # --------------------------------

              if (Test-Path $backup) {

                  Write-Host "Starting rollback..."

                  # Remove failed deployment
                  Get-ChildItem `
                    -Path $destination `
                    -Force |
                  Where-Object {
                      $_.Name -ne "web.config"
                  } |
                  Remove-Item `
                    -Recurse `
                    -Force


                  # Restore backup
                  Copy-Item `
                    -Path "$backup\*" `
                    -Destination $destination `
                    -Recurse `
                    -Force


                  Write-Host "Rollback completed."

              }
              else {

                  Write-Host "No backup available. Rollback skipped."

              }


              throw "Deployment failed. Previous version restored."

          }


          # --------------------------------
          # Deployment Successful
          # --------------------------------

          Write-Host "===================================="
          Write-Host "Tax Frontend Deployment Successful"
          Write-Host "===================================="


