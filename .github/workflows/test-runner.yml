name: Deploy Tax Frontend

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build-and-deploy:

    runs-on: [self-hosted, Windows, X64, taxfrontend]

    steps:

      # --------------------------------
      # 1. Checkout source code
      # --------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------
      # 2. Check Node
      # --------------------------------
      - name: Check Node and NPM
        shell: powershell
        run: |
          Write-Host "Node version:"
          node -v

          Write-Host "NPM version:"
          npm -v


      # --------------------------------
      # 3. Install dependencies
      # --------------------------------
      - name: Install Dependencies
        shell: powershell
        run: |
          npm ci


      # --------------------------------
      # 4. Build React/Vite
      # --------------------------------
      - name: Build Frontend
        shell: powershell
        run: |
          npm run build


      # --------------------------------
      # 5. Verify build
      # --------------------------------
      - name: Verify Build
        shell: powershell
        run: |

          $buildPath = "$env:GITHUB_WORKSPACE\dist"

          if (!(Test-Path $buildPath)) {
              Write-Error "dist folder was not created."
              exit 1
          }

          Write-Host "Build successful."
          Write-Host "Build location:"
          Write-Host $buildPath

          Get-ChildItem $buildPath


      # --------------------------------
      # 6. Deploy to IIS
      # --------------------------------
      - name: Deploy to IIS
        shell: powershell
        run: |

          $source = "$env:GITHUB_WORKSPACE\dist"
          $destination = "C:\test\tax-frontend"

          Write-Host "Source:"
          Write-Host $source

          Write-Host "Destination:"
          Write-Host $destination


          # Make sure destination exists
          if (!(Test-Path $destination)) {

              New-Item `
                -ItemType Directory `
                -Path $destination `
                -Force

          }


          # Remove old frontend files
          Get-ChildItem `
            -Path $destination `
            -Force |
            Where-Object {
                $_.Name -ne "web.config"
            } |
            Remove-Item `
              -Recurse `
              -Force


          # Copy new build
          Copy-Item `
            -Path "$source\*" `
            -Destination $destination `
            -Recurse `
            -Force


          Write-Host "===================================="
          Write-Host "Tax Frontend Deployment Successful"
          Write-Host "===================================="


          Get-ChildItem $destination