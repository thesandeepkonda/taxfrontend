name: Test Windows Runner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, Windows, X64, taxfrontend]

    steps:

      - name: Test Runner
        shell: powershell
        run: |
          Write-Host "===================================="
          Write-Host "GitHub Actions Runner is working"
          Write-Host "===================================="
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

      - name: Check Node
        shell: powershell
        run: |
          Write-Host "Node version:"
          node -v

          Write-Host "NPM version:"
          npm -v

      - name: Prepare Deployment Folder
        shell: powershell
        run: |
          $path = "C:\test\tax-frontend"

          if (!(Test-Path $path)) {
              New-Item -ItemType Directory -Path $path -Force
              Write-Host "Created deployment folder: $path"
          }
          else {
              Write-Host "Deployment folder already exists: $path"
          }

      - name: Test Deployment Write Access
        shell: powershell
        run: |
          $path = "C:\test\tax-frontend"
          $testFile = "$path\github-actions-test.txt"

          "GitHub Actions test" | Out-File $testFile -Force

          if (Test-Path $testFile) {
              Write-Host "SUCCESS: Runner can write to IIS deployment folder."
              Remove-Item $testFile -Force
          }
          else {
              Write-Error "Runner cannot write to deployment folder."
              exit 1
          }