name: Test Windows Runner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, Windows, X64, taxfrontend]

    steps:
      - name: Test Runner
        shell: powershell
        run: |
          Write-Host "===================================="
          Write-Host "GitHub Actions Runner is working"
          Write-Host "===================================="
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

      - name: Check Node
        shell: powershell
        run: |
          Write-Host "Node version:"
          node -v

          Write-Host "NPM version:"
          npm -v

      - name: Check Deployment Folder
        shell: powershell
        run: |
          $path = "C:\test\tax-frontend"

          if (Test-Path $path) {
              Write-Host "Deployment folder exists: $path"
          }
          else {
              Write-Error "Deployment folder does not exist: $path"
              exit 1
          }

      - name: Test Deployment Write Access
        shell: powershell
        run: |
          $path = "C:\test\tax-frontend"
          $testFile = "$path\github-actions-test.txt"

          "GitHub Actions deployment test" | Out-File $testFile -Force

          if (Test-Path $testFile) {
              Write-Host "Write permission is working."
              Remove-Item $testFile -Force
          }
          else {
              Write-Error "Cannot write to $path"
              exit 1
          }